name: Crypto Survival Gen3D Learned Temporal Gate
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - 'crypto_survival_training/train_okx_dynamic_brain_gen3d.py'
      - '.github/workflows/crypto_survival_gen3d_gate.yml'
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact training dependencies
        run: pip install --disable-pip-version-check requests numpy pandas scikit-learn==1.9.0 joblib
      - name: Train Gen3D learned temporal gate on genuine OKX history
        env:
          PYTHONPATH: '.'
          MAX_SYMBOLS: '72'
          ROUNDTRIP_COST_BPS: '30'
          BASE_TRAIN_ROWS: '90000'
          OUT_DIR: 'trained_artifact_gen3d'
        run: |
          set -o pipefail
          mkdir -p trained_artifact_gen3d
          python crypto_survival_training/train_okx_dynamic_brain_gen3d.py | tee trained_artifact_gen3d/workflow.log
      - name: Upload Gen3D brain and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-r1f-gen3d-learned-gate
          path: trained_artifact_gen3d/
          if-no-files-found: warn
          retention-days: 7
