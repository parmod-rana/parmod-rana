name: Crypto Survival Orderbook Archive Probe
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - '.github/workflows/crypto_survival_orderbook_archive_probe.yml'
      - 'crypto_survival_training/probe_okx_orderbook_archive.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests
      - name: Probe OKX historical order-book archive modules
        run: |
          set -o pipefail
          python crypto_survival_training/probe_okx_orderbook_archive.py | tee orderbook_archive_probe.log
      - name: Upload order-book probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-orderbook-archive-probe
          path: |
            orderbook_archive_probe/
            orderbook_archive_probe.log
          retention-days: 7
