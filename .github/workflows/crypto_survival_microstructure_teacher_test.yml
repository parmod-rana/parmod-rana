name: Crypto Survival Microstructure Teacher Validation
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - 'crypto_survival_training/run_microstructure_experience_teacher.py'
      - 'crypto_survival_training/test_microstructure_experience_teacher.py'
      - 'crypto_survival_training/MICROSTRUCTURE_TEACHER_MODEL_PROTOCOL.json'
      - '.github/workflows/crypto_survival_microstructure_teacher_test.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed teacher dependencies
        run: pip install --disable-pip-version-check numpy pandas scipy scikit-learn==1.9.0
      - name: Compile frozen teacher
        run: python -m py_compile crypto_survival_training/run_microstructure_experience_teacher.py crypto_survival_training/test_microstructure_experience_teacher.py
      - name: Run causal teacher unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest -v crypto_survival_training.test_microstructure_experience_teacher
