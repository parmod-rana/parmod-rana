name: R3 V4 source mirror

on:
  push:
    paths:
      - 'VARDHANI_HIGH_SPECIALIST_R3/bootstrap/V4_READY'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified V4 source archive
        shell: bash
        run: |
          set -euo pipefail
          BOOT='VARDHANI_HIGH_SPECIALIST_R3/bootstrap'
          cat "$BOOT"/chunk_*.b64part | base64 -d > /tmp/r3-v4.zip
          echo '719720a6000594a47854fd5110f1f0b989eaa8455710434d70af8c07c342c0eb  /tmp/r3-v4.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import zipfile
          z=zipfile.ZipFile('/tmp/r3-v4.zip')
          for n in z.namelist():
              p=Path(n)
              if p.is_absolute() or '..' in p.parts:
                  raise SystemExit('UNSAFE_ARCHIVE_PATH:'+n)
          z.extractall('/tmp/r3-v4')
          PY
          echo 'c228dc28f9fd4a9ffb174be0f4c40e42e25c742b3d9b97861eb8100169e97c6c  /tmp/r3-v4/SOURCE_MANIFEST.json' | sha256sum -c -
      - name: Mirror source atomically
        shell: bash
        run: |
          set -euo pipefail
          DEST='VARDHANI_HIGH_SPECIALIST_R3'
          cp -a /tmp/r3-v4/. "$DEST/"
          rm -f "$DEST/releases/VARDHANI_HIGH_SPECIALIST_R3_SOURCE_SNAPSHOT_V2.zip" \
                "$DEST/releases/VARDHANI_HIGH_SPECIALIST_R3_SOURCE_SNAPSHOT_V3.zip" \
                "$DEST/SOURCE_MANIFEST_V3.json"
          rm -rf "$DEST/bootstrap"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Mirror authoritative VARDHANI R3 Source V4'
            git push origin HEAD:main
          fi
