name: Crypto Survival Funding History Probe
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - '.github/workflows/crypto_survival_funding_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests pandas numpy
      - name: Probe genuine OKX funding history
        env:
          PYTHONPATH: .
        run: python crypto_survival_training/probe_okx_funding_history.py | tee funding_probe.log
      - name: Upload funding probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-funding-history-probe
          path: |
            funding_probe/
            funding_probe.log
          retention-days: 7
