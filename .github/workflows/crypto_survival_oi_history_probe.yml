name: Crypto Survival OI History Probe
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - '.github/workflows/crypto_survival_oi_history_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests
      - name: Probe OKX historical open interest
        run: |
          set -o pipefail
          python crypto_survival_training/probe_okx_oi_history.py | tee oi_history_probe.log
      - name: Upload OI probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-oi-history-probe
          path: |
            oi_history_probe/
            oi_history_probe.log
          retention-days: 7
