name: Crypto Survival Real Training

on:
  push:
    branches:
      - crypto-survival-r1d-training
    paths:
      - 'crypto_survival_training/**'
      - '.github/workflows/crypto_survival_train.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: pip install --disable-pip-version-check requests numpy pandas scikit-learn joblib
      - name: Train on genuine historical crypto data
        env:
          HORIZON_BARS: '4'
          ROUNDTRIP_COST_BPS: '30'
          OUT_DIR: 'trained_artifact'
          PYTHONPATH: '.'
        run: |
          mkdir -p trained_artifact
          python crypto_survival_training/train_verified_macro.py | tee trained_artifact/workflow.log
      - name: Upload trained brain and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-r1d-real-training
          path: trained_artifact/
          if-no-files-found: warn
          retention-days: 7
