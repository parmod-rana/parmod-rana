name: Crypto Survival Gen3E Conservative Experience
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - '.github/workflows/crypto_survival_gen3e_experience.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact training dependencies
        run: pip install --disable-pip-version-check requests numpy pandas scikit-learn==1.9.0 joblib
      - name: Train Gen3E causal experience brain on genuine OKX history
        env:
          PYTHONPATH: .
          MAX_SYMBOLS: '72'
          ROUNDTRIP_COST_BPS: '30'
          BASE_TRAIN_ROWS: '85000'
          OUT_DIR: trained_artifact_gen3e
        run: |
          set -o pipefail
          mkdir -p trained_artifact_gen3e
          python crypto_survival_training/train_okx_dynamic_brain_gen3e.py | tee trained_artifact_gen3e/workflow.log
      - name: Upload Gen3E brain and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-r1f-gen3e-experience
          path: trained_artifact_gen3e/
          retention-days: 7
