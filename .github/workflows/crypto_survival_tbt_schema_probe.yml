name: Crypto Survival Historical TBT Schema Probe
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - '.github/workflows/crypto_survival_tbt_schema_probe.yml'
      - 'crypto_survival_training/probe_okx_tbt_historical_schema.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Probe genuine historical schema headers
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python crypto_survival_training/probe_okx_tbt_historical_schema.py | tee tbt_schema_probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-survival-tbt-schema-probe
          path: tbt_schema_probe.log
          retention-days: 7
