name: Crypto Survival Generation 2 OKX
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - 'crypto_survival_training/train_okx_gen2.py'
      - 'crypto_survival_training/train_okx_gen2_fast.py'
      - '.github/workflows/crypto_survival_gen2.yml'
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests numpy pandas scikit-learn joblib
      - name: Train Generation 2 on genuine OKX history
        env:
          PYTHONPATH: '.'
          MAX_SYMBOLS: '60'
          HORIZON_BARS: '2'
          ROUNDTRIP_COST_BPS: '30'
          OUT_DIR: 'trained_artifact_gen2_fast'
        run: |
          mkdir -p trained_artifact_gen2_fast
          python crypto_survival_training/train_okx_gen2_fast.py | tee trained_artifact_gen2_fast/workflow.log
      - name: Upload Generation 2 brain and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-r1e-okx-real-training-fast
          path: trained_artifact_gen2_fast/
          if-no-files-found: warn
          retention-days: 7
