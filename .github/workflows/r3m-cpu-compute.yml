name: VARDHANI R3M CPU compute

on:
  push:
    branches: [r3e-economic-router-freeze]
    paths:
      - '.github/workflows/r3m-cpu-compute.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research dependencies
        run: pip install -r VARDHANI_HIGH_SPECIALIST_R3/economic_research/R3E/requirements-r3e.txt
      - name: Frozen R3M preflight
        working-directory: VARDHANI_HIGH_SPECIALIST_R3/economic_research/R3M
        run: |
          python -m py_compile r3m_runner.py r3m_exact_member_cpu.py
          python - <<'PY'
          import json,sys
          from pathlib import Path
          import r3m_runner as r
          here=Path.cwd(); sys.path.insert(0,str(here.parent/'R3E'))
          from r3e_authorized_source_manifest import ROWS
          p=json.load(open('TEACHER_ECONOMIC_R3M_COMPRESSION_BREAKOUT_PREREG_V1.json'))
          assert p['status']=='FROZEN_BEFORE_ANY_R3M_OUTPUT'
          assert len(ROWS)==108 and {x[1] for x in ROWS}=={2022,2023,2024}
          assert r.CHECKPOINTS==('10:00','10:15','10:30','10:45','11:00','11:15','11:30','11:45','12:00','12:15','12:30','12:45','13:00','13:15','13:30','13:45','14:00')
          assert r.LOOKBACK_DATES==126 and r.MIN_HISTORY==120
          assert r.RV_Q==0.35 and r.ATR_Q==0.50 and r.IMPULSE_Q==0.75 and r.MAX_TRADES_PER_DATE==2
          assert tuple(p['signal']['checkpoints_ist'])==r.CHECKPOINTS
          h=p['hard_boundaries']
          assert h['teacher_v2_changed'] is False and h['student_optimizer_steps']==0
          assert h['gpu_allowed'] is False and h['real_orders'] is False
          assert h['2025_used'] is False and h['2026_used'] is False and h['economic_edge_claimed'] is False
          print('R3M_FROZEN_PREFLIGHT_PASS')
          PY

  compute:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research dependencies
        run: pip install -r VARDHANI_HIGH_SPECIALIST_R3/economic_research/R3E/requirements-r3e.txt
      - name: Execute preregistered R3M on CPU
        working-directory: VARDHANI_HIGH_SPECIALIST_R3/economic_research/R3M
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        run: |
          python r3m_exact_member_cpu.py --work "$RUNNER_TEMP/r3m_exact_cpu_work" | tee "$RUNNER_TEMP/r3m_compute.log"
      - name: Publish result summary
        if: always()
        run: |
          echo '--- R3M RESULT FILE ---'
          if [ -f "$RUNNER_TEMP/r3m_exact_cpu_work/TEACHER_ECONOMIC_R3M_DEVELOPMENT_RESULT_V1.json" ]; then
            cat "$RUNNER_TEMP/r3m_exact_cpu_work/TEACHER_ECONOMIC_R3M_DEVELOPMENT_RESULT_V1.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vardhani-r3m-cpu-result
          path: |
            ${{ runner.temp }}/r3m_exact_cpu_work/TEACHER_ECONOMIC_R3M_DEVELOPMENT_RESULT_V1.json
            ${{ runner.temp }}/r3m_exact_cpu_work/R3M_EXACT_MEMBER_RECONSTRUCTION_AUDIT_V1.json
            ${{ runner.temp }}/r3m_exact_cpu_work/R3M_2023_FROZEN_TRADES.csv
            ${{ runner.temp }}/r3m_exact_cpu_work/R3M_2024_AUDIT_TRADES.csv
            ${{ runner.temp }}/r3m_compute.log
          if-no-files-found: warn
          retention-days: 7
