name: Crypto Survival Gen3F V2 Leverage Integrity
on:
  push:
    branches: [crypto-survival-r1d-training]
    paths:
      - '.github/workflows/crypto_survival_gen3f_v2_leverage.yml'
      - 'crypto_survival_training/train_okx_dynamic_brain_gen3f_v2.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact training dependencies
        run: pip install --disable-pip-version-check requests numpy pandas scikit-learn==1.9.0 joblib
      - name: Train Gen3F V2 with verified genuine funding and OI history
        env:
          PYTHONPATH: .
          MAX_SYMBOLS: '72'
          ROUNDTRIP_COST_BPS: '30'
          MAX_TRAIN_ROWS: '110000'
          OUT_DIR: trained_artifact_gen3f_v2
        run: |
          set -o pipefail
          mkdir -p trained_artifact_gen3f_v2
          python crypto_survival_training/train_okx_dynamic_brain_gen3f_v2.py | tee trained_artifact_gen3f_v2/workflow.log
      - name: Upload Gen3F V2 brain and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-survival-r1f-gen3f-v2-leverage
          path: trained_artifact_gen3f_v2/
          retention-days: 7
